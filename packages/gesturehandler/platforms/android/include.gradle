dependencies {
    implementation "androidx.annotation:annotation:1.1.0"

    if (project.hasProperty("tempBuild")) {
        // NativeScript CLIs before 9.2 don't load org.nativescript:gradle-api in this plugin's own aar build.
        if (project.extensions.findByName("nativescript") == null) {
            throw new GradleException("@nativescript-community/gesturehandler needs NativeScript CLI 9.2 or newer: npm i -D nativescript@latest")
        }
        def core = nativescript.findPlugin("@nativescript/core") ?: nativescript.findPlugin("@akylas/nativescript")
        if (core == null) {
            throw new GradleException("@nativescript-community/gesturehandler needs @nativescript/core or @akylas/nativescript")
        }
        compileOnly core.artifacts
    }
}
